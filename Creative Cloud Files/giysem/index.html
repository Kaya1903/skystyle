<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    // Phones: open at 95%, like zooming the page out one notch, so the screen feels less cramped.
    if (matchMedia('(pointer: coarse) and (max-width: 600px)').matches) {
      // Fixed at that size, like an app: no pinch zoom (iPhone needs the gesture event as well).
      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=0.95, maximum-scale=0.95, user-scalable=no, viewport-fit=cover');
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    }
  </script>
